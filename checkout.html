<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Time - Checkout</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0b0b;color:white}
header{
background:#111;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #333;
}
.logo{color:#d4af37;font-size:28px;font-weight:bold}
.container{
max-width:1200px;
margin:auto;
padding:40px 8%;
display:grid;
grid-template-columns:2fr 1fr;
gap:40px;
}
.box{
background:#171717;
padding:25px;
border-radius:18px;
border:1px solid #2a2a2a;
}
h2{margin-bottom:20px;color:#d4af37}
input,select{
width:100%;
padding:14px;
margin:10px 0;
background:#222;
border:none;
border-radius:10px;
color:white;
}
.payment{
display:flex;
flex-direction:column;
gap:12px;
margin-top:15px;
}
.option{
background:#222;
padding:14px;
border-radius:10px;
cursor:pointer;
display:flex;
align-items:center;
gap:10px;
border:1px solid transparent;
}
.option:hover{
border-color:#d4af37;
}
.summary-item{
display:flex;
justify-content:space-between;
margin:12px 0;
}
.total{
font-size:22px;
font-weight:bold;
color:#d4af37;
}
button{
width:100%;
padding:16px;
margin-top:25px;
background:#d4af37;
color:black;
font-size:18px;
font-weight:bold;
border:none;
border-radius:12px;
cursor:pointer;
}
button:hover{
background:#f5cf55;
}
.coupon{
display:flex;
gap:10px;
margin-top:15px;
}
.coupon input{margin:0}
@media(max-width:850px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T6GN83MW"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>
<div class="logo">Luxury Time</div>
<div>Secure Checkout</div>
</header>

<div class="container">

<div class="box">

<h2>Shipping Details</h2>

<input placeholder="Full Name">
<input placeholder="Phone Number">
<input placeholder="Email">
<input placeholder="House / Street">
<input placeholder="City">

<div style="display:flex;gap:10px;">
<input placeholder="State">
<input placeholder="Pincode">
</div>

<h2 style="margin-top:35px;">Payment Method</h2>

<div class="payment">

<label class="option">
<input type="radio" name="pay" checked>
UPI (GPay, PhonePe, Paytm)
</label>

<label class="option">
<input type="radio" name="pay">
Credit / Debit Card
</label>

<label class="option">
<input type="radio" name="pay">
Net Banking
</label>

<label class="option">
<input type="radio" name="pay">
Wallet
</label>

<label class="option">
<input type="radio" name="pay">
Cash on Delivery
</label>

</div>

<button onclick="location.href='payment-success.html'">
Pay Securely
</button>

</div>

<div class="box">

<h2>Order Summary</h2>

<div class="summary-item">
<span>Royal Black Watch</span>
<span>₹18,999</span>
</div>

<div class="summary-item">
<span>Shipping</span>
<span>FREE</span>
</div>

<div class="summary-item">
<span>GST</span>
<span>₹3,420</span>
</div>

<div class="summary-item">
<span>Discount</span>
<span style="color:#6cff6c;">-₹1,000</span>
</div>

<div class="coupon">
<input placeholder="Coupon Code">
<button style="margin:0;width:auto;padding:14px 18px;">
Apply
</button>
</div>

<hr style="margin:25px 0;border-color:#333;">

<div class="summary-item total">
<span>Total</span>
<span>₹21,419</span>
</div>

<p style="color:#999;margin-top:15px;font-size:14px;">
100% Secure Payment
</p>

</div>

</div>

</body>
</html>
