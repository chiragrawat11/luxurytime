<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order</title>

<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial}
.container{max-width:700px;margin:auto;padding:60px 8%}
.box{background:#171717;padding:30px;border-radius:20px}
input{width:100%;padding:15px;background:#222;color:white;border:none;border-radius:10px;margin:12px 0}
button{background:#d4af37;color:black;padding:14px 24px;border:none;border-radius:10px;font-weight:bold}
.timeline{margin-top:35px}
.step{border-left:3px solid #d4af37;padding-left:20px;margin:20px 0}
</style>
</head>
<body>

<div class="container">

<h1 style="color:#d4af37;">Track Your Order</h1>

<div class="box">

<input placeholder="Order ID">

<input placeholder="Phone Number">

<button>Track Order</button>

<div class="timeline">

<div class="step">✓ Order Placed</div>

<div class="step">✓ Packed</div>

<div class="step">• Shipped</div>

<div class="step">• Out for Delivery</div>

<div class="step">• Delivered</div>

</div>

</div>

</div>

</body>
</html>
